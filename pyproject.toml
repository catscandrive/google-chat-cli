[project]
name = "google-chat-cli"
version = "0.1.0"
description = "Interactive Google Chat CLI for sending DMs, posting to spaces, and live polling as a user"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
keywords = ["google-chat", "cli", "chat", "oauth", "workspace", "terminal"]
dependencies = [
  "google-api-python-client>=2.170.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
]

[tool.uv]
package = false
